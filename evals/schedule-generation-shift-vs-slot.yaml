# Shift input → slot scorer comparison eval
# Uses existing shift-level input transform, converts output to slots, scores at slot level
# Run: npm run eval:schedule:shift-vs-slot

description: "Schedule Generation (Shift Input → Slot Scorer)"

prompts:
  - id: schedule-generation
    label: "Schedule Generation"
    raw: "file://prompts/schedule-generation.txt"

providers:
  - id: anthropic:messages:claude-sonnet-4-5-20250929
    label: "Claude Sonnet 4.5"
    config:
      temperature: 0
      max_tokens: 16384

tests:
  - description: "Real cafe week — 23 Feb (shift→slot)"
    vars:
      task_type: schedule_generation
      input: "file://golden/schedules/week-23feb.json"
      reference: "file://golden/schedules/week-23feb-expected-slots.json"
    assert:
      - type: is-json
      - type: javascript
        value: "file://scorers/slot-scorer.ts"

  - description: "Real cafe week — 2 Mar (shift→slot)"
    vars:
      task_type: schedule_generation
      input: "file://golden/schedules/week-2mar.json"
      reference: "file://golden/schedules/week-2mar-expected-slots.json"
    assert:
      - type: is-json
      - type: javascript
        value: "file://scorers/slot-scorer.ts"

  - description: "Real cafe week — 9 Mar (shift→slot)"
    vars:
      task_type: schedule_generation
      input: "file://golden/schedules/week-9mar.json"
      reference: "file://golden/schedules/week-9mar-expected-slots.json"
    assert:
      - type: is-json
      - type: javascript
        value: "file://scorers/slot-scorer.ts"

  - description: "Real cafe week — 16 Mar (shift→slot)"
    vars:
      task_type: schedule_generation
      input: "file://golden/schedules/week-16mar.json"
      reference: "file://golden/schedules/week-16mar-expected-slots.json"
    assert:
      - type: is-json
      - type: javascript
        value: "file://scorers/slot-scorer.ts"

  - description: "Real cafe week — 23 Mar (shift→slot)"
    vars:
      task_type: schedule_generation
      input: "file://golden/schedules/week-23mar.json"
      reference: "file://golden/schedules/week-23mar-expected-slots.json"
    assert:
      - type: is-json
      - type: javascript
        value: "file://scorers/slot-scorer.ts"

  - description: "Real cafe week — 30 Mar (shift→slot)"
    vars:
      task_type: schedule_generation
      input: "file://golden/schedules/week-30mar.json"
      reference: "file://golden/schedules/week-30mar-expected-slots.json"
    assert:
      - type: is-json
      - type: javascript
        value: "file://scorers/slot-scorer.ts"

outputPath: evals/results/schedule-generation-shift-vs-slot.json

defaultTest:
  options:
    transformVars: "file://transforms/compute-eligibility.js"
    transform: "file://transforms/shift-to-slots.js"
