# Classification eval — 1 provider × 9 tests = 9 combos
# Run: npm run eval:classification

description: "Intent Classification"

prompts:
  - id: classification
    label: "Intent Classification"
    raw: "file://prompts/classification.txt"

providers:
  - id: openai:gpt-4.1-nano
    label: "GPT-4.1-nano"
    config:
      temperature: 0

tests:
  # --- Availability update intents (from availability-intents.json) ---
  - description: "Availability — wedding on Saturday"
    vars:
      task_type: classification
      input: "I cannot work this Saturday, got wedding to attend"
      expected_intent: availability_update
    assert:
      - type: is-json
      - type: javascript
        value: |
          const result = JSON.parse(output);
          const expected = context.vars.expected_intent;
          return result.intent === expected ? { pass: true, score: 1.0, reason: 'Matched' } : { pass: false, score: 0.0, reason: `Expected ${expected}, got ${result.intent}` };

  - description: "Availability — MC today"
    vars:
      task_type: classification
      input: "MC today, not feeling well"
      expected_intent: availability_update
    assert:
      - type: is-json
      - type: javascript
        value: |
          const result = JSON.parse(output);
          const expected = context.vars.expected_intent;
          return result.intent === expected ? { pass: true, score: 1.0, reason: 'Matched' } : { pass: false, score: 0.0, reason: `Expected ${expected}, got ${result.intent}` };

  - description: "Availability — full week available"
    vars:
      task_type: classification
      input: "Next week Monday to Friday all can"
      expected_intent: availability_update
    assert:
      - type: is-json
      - type: javascript
        value: |
          const result = JSON.parse(output);
          const expected = context.vars.expected_intent;
          return result.intent === expected ? { pass: true, score: 1.0, reason: 'Matched' } : { pass: false, score: 0.0, reason: `Expected ${expected}, got ${result.intent}` };

  - description: "Availability — taking leave"
    vars:
      task_type: classification
      input: "Taking leave on 15th and 16th Jan"
      expected_intent: availability_update
    assert:
      - type: is-json
