# Preference extraction eval — 1 provider × 2 tests = 2 combos
# Run: npm run eval:preferences

description: "Preference Extraction"

prompts:
  - id: preference-extraction
    label: "Preference Extraction"
    raw: "file://prompts/preference-extraction.txt"

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    label: "Claude Haiku 4.5"
    config:
      temperature: 0
      max_tokens: 4096

tests:
  - description: "Extract preferences — morning shift, avoid Saturday night, avoid coworker"
    vars:
      task_type: preference_extraction
      input: "Staff: I really prefer morning shifts, like 7 to 3. Afternoon can also but not so nice. And please don't put me on Saturday nights, I have church on Sunday morning.\n\nManager: Noted. How about working with the new guy Jason?\n\nStaff: Actually ah, I don't mind. But I prefer not to be paired with Karen, we always clash."
      expected: |
        {"preferences":[{"type":"shift_time","rule":{"field":"time","operator":"prefer","value":"07:00-15:00"}},{"type":"shift_time","rule":{"field":"time","operator":"avoid","value":"saturday_night"}},{"type":"coworker","rule":{"field":"coworker","operator":"avoid","value":"Karen"}}]}
    assert:
      - type: is-json
      - type: javascript
        value: "file://scorers/preference-scorer.ts"

  - description: "Extract preferences — max hours, day preference, morning shifts"
    vars:
      task_type: preference_extraction
      input: "I can only work maximum 3 days a week because I'm studying part-time. Preferably Tuesday, Wednesday, Thursday. Morning shifts are better for me because I have class at night."
      expected: |
        {"preferences":[{"type":"hours","rule":{"field":"hours","operator":"max","value":3}},{"type":"day_off","rule":{"field":"day","operator":"prefer","value":"tue,wed,thu"}},{"type":"shift_time","rule":{"field":"time","operator":"prefer","value":"morning"}}]}
    assert:
      - type: is-json
      - type: javascript
        value: "file://scorers/preference-scorer.ts"

outputPath: evals/results/preference-extraction.json

defaultTest:
  options:
    transform: "(() => { const s = output.replace(/^```(?:json)?\\s*\\n?/gm, '').replace(/\\n?\\s*```\\s*$/gm, '').trim(); const i = s.indexOf('{'); const j = s.lastIndexOf('}'); return (i !== -1 && j > i) ? s.substring(i, j + 1) : s; })()"
